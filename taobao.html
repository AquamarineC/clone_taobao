    <!-- 浮动元素产生了浮动流

    所有产生了浮动流的元素都不会占据父元素的高度，且块级将元素看不到它们

    产生了bfc的元素和文本类属性(inline)的元素以及文本都能看到浮动元素 
    
    
    position: absolute; 跳到上层立交桥，让出之前的空间，相对于最近的定位父元素进行定位，
    若没有则相对于body进行定位
    
    position: relative; 可以想象成灵魂出窍，不让出之前的空间，相对于自身出生位置进行定位


    当设置 position: absolute或float： left/right
    display自动设置 inline-block，从而可以设置宽高


    -->
